<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý sản phẩm | PT GUNDAM</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"><script src="products-data.js" defer></script><script src="site.js" defer></script><script src="admin-products.js" defer></script></head><body><div id="siteHeader"></div><main class="container admin-shell"><aside class="admin-sidebar"><div class="admin-brand">⚙ QUẢN TRỊ PT GUNDAM</div><nav class="admin-menu"><a href="admin.html">▦　Dashboard</a><a class="active" href="admin-products.html">▣　Sản phẩm</a><a href="admin-products.html">▤　Danh mục</a><a href="admin.html#orders">▣　Đơn hàng</a><a href="admin.html#customers">♙　Khách hàng</a><a href="admin.html#stats">▥　Thống kê</a><a href="index.html">⌂　Về cửa hàng</a></nav></aside><section class="admin-main"><div class="admin-top"><h1>Quản lý sản phẩm</h1><span>Xin chào, <b>Admin</b>　⌄</span></div><div class="admin-panel"><div class="admin-toolbar"><input id="adminSearch" type="search" placeholder="Tìm theo tên, mã sản phẩm..."><select id="adminGrade"><option value="all">Danh mục: Tất cả</option><option>HG</option><option>RG</option><option>MG</option><option>Khác</option></select><select id="adminStock"><option value="all">Trạng thái: Tất cả</option><option value="in">Đang bán</option><option value="out">Hết hàng</option></select><button class="btn primary" id="addProduct">＋ THÊM SẢN PHẨM</button></div><div style="overflow:auto"><table class="admin-table" style="min-width:700px"><thead><tr><th><input type="checkbox" id="checkAll"></th><th>Ảnh</th><th>Mã SP</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Thao tác</th></tr></thead><tbody id="adminProductRows"></tbody></table></div><div style="padding-top:12px;color:#758898;font-size:12px" id="adminCount"></div></div></section></main><div id="siteFooter"></div>
